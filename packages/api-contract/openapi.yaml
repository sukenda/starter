openapi: 3.1.0
info:
  title: Starter API
  version: 0.3.0
  description: Canonical HTTP contract shared by backend, frontend, and mobile.
servers:
  - url: http://localhost:8080
paths:
  /health:
    get:
      operationId: getHealth
      tags: [System]
      responses:
        '200': { description: Service is alive }
  /ready:
    get:
      operationId: getReadiness
      tags: [System]
      responses:
        '200': { description: Service dependencies are ready }
        '503': { description: A required dependency is unavailable }
  /api/v1/auth/login:
    post:
      operationId: login
      tags: [Auth]
      description: Web clients set client=web and receive the refresh credential in an HttpOnly cookie. Native clients receive it in JSON.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/auth/refresh:
    post:
      operationId: refreshSession
      tags: [Auth]
      description: Native clients send refresh_token in JSON. Browser clients send the HttpOnly refresh cookie and a matching X-CSRF-Token header; refresh_token may be omitted from JSON.
      parameters:
        - in: header
          name: X-CSRF-Token
          required: false
          description: Required when refreshing a browser cookie-backed session.
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '200':
          description: Rotated session credentials. Browser responses omit refresh_token from JSON and rotate cookies instead.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenEnvelope' }
        '400': { description: No refresh credential was supplied }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Browser CSRF validation failed }
  /api/v1/auth/me:
    get:
      operationId: getCurrentUser
      tags: [Auth]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Current principal
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/auth/logout:
    post:
      operationId: logout
      tags: [Auth]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Session revoked; browser session cookies are cleared }
        '401': { $ref: '#/components/responses/Unauthorized' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 1 }
        client:
          type: string
          enum: [web, mobile]
          description: Selects browser cookie or native JSON refresh-token transport. Omitted values use native JSON transport for backward compatibility.
    RefreshRequest:
      type: object
      properties:
        refresh_token:
          type: string
          description: Required for native refresh and omitted for browser cookie-backed refresh.
    User:
      type: object
      required: [id, name, email]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        permissions:
          type: array
          items: { type: string }
    Tokens:
      type: object
      required: [access_token, token_type, access_expires_at, refresh_expires_at]
      properties:
        access_token: { type: string }
        refresh_token:
          type: string
          description: Present for native sessions and omitted from browser responses.
        token_type: { type: string, const: Bearer }
        access_expires_at: { type: string, format: date-time }
        refresh_expires_at: { type: string, format: date-time }
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
        request_id: { type: string }
        details: {}
    LoginData:
      type: object
      required: [user, tokens]
      properties:
        user: { $ref: '#/components/schemas/User' }
        tokens: { $ref: '#/components/schemas/Tokens' }
    LoginEnvelope:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/LoginData' }
    TokenEnvelope:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/Tokens' }
    UserEnvelope:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/User' }
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error: { $ref: '#/components/schemas/Error' }
  responses:
    Unauthorized:
      description: Authentication failed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
